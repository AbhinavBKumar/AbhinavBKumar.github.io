<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCam: Advanced AI Peek Detector & GPS</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Face Detection scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-5xl flex items-center justify-between py-4 border-b border-slate-800">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span>🛡️🌍</span> SecureCam & Peek Detector
        </h1>
        <a href="index.html" class="text-sm text-blue-400 hover:underline">← Back to Home</a>
    </header>

    <!-- Main Content Grid -->
    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6 my-6">
        
        <!-- Video Feed & Canvas Area (2 Columns) -->
        <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl">
            <div id="status-banner" class="absolute top-4 z-10 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition-all duration-300">
                System Secure
            </div>

            <!-- Video wrapper -->
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden flex items-center justify-center">
                <video id="webcam" class="absolute inset-0 w-full h-full object-cover -scale-x-100" playsinline></video>
                <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>
            </div>

            <!-- Action Controls under Video -->
            <div class="w-full flex items-center justify-between mt-4 gap-3">
                <div class="text-xs font-mono text-slate-400 truncate" id="live-gps-readout">
                    📍 GPS: Fetching coordinates...
                </div>
                <button onclick="captureGeotaggedPhoto()" class="py-2 px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-lg shrink-0">
                    📸 Snap Photo
                </button>
            </div>
        </div>

        <!-- Sidebar Controls & Logs -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-2xl space-y-4">
            
            <!-- Live Status & Threshold Settings -->
            <div class="space-y-3">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Detection Settings</h2>
                
                <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50 space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">Faces in view:</span>
                        <span id="face-count-display" class="font-bold text-white">0</span>
                    </div>
                    <div class="flex justify-between text-xs items-center">
                        <span class="text-slate-400">Max Allowed Faces:</span>
                        <span id="threshold-val" class="font-bold text-blue-400 bg-blue-950/60 px-2 py-0.5 rounded border border-blue-900">1</span>
                    </div>
                    <input type="range" id="max-faces-slider" min="1" max="5" value="1" oninput="updateThreshold(this.value)" class="w-full accent-blue-500 cursor-pointer">
                </div>
            </div>

            <!-- Toggle Switches Section -->
            <div class="space-y-2 pt-2 border-t border-slate-800">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-2">Controls</h2>
                
                <!-- Camera Toggle Switch -->
                <div class="flex items-center justify-between bg-slate-800/40 px-3 py-2.5 rounded-xl border border-slate-700/50">
                    <span class="text-xs font-medium text-slate-300">📷 Camera Status</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="cam-toggle" checked onchange="toggleCamera(this)" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600"></div>
                    </label>
                </div>

                <!-- Speaker Toggle Switch -->
                <div class="flex items-center justify-between bg-slate-800/40 px-3 py-2.5 rounded-xl border border-slate-700/50">
                    <span class="text-xs font-medium text-slate-300">🔊 Audio Beeps</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="audio-toggle" checked onchange="toggleAudio(this)" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>

                <button onclick="refreshGPS()" class="w-full py-2 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium transition-colors">
                    🔄 Refresh GPS Location
                </button>
            </div>

            <!-- Logs Section -->
            <div>
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-2">Activity Logs</h2>
                <div id="log-container" class="space-y-2 max-h-36 overflow-y-auto pr-1 text-xs font-mono">
                    <div class="text-slate-500 italic">System initializing...</div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-xs text-slate-500 py-2">
        Powered by MediaPipe AI & HTML5 Geolocation API
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBanner = document.getElementById('status-banner');
        const logContainer = document.getElementById('log-container');
        const gpsReadout = document.getElementById('live-gps-readout');
        const faceCountDisplay = document.getElementById('face-count-display');
        const thresholdValDisplay = document.getElementById('threshold-val');

        let audioEnabled = true;
        let cameraEnabled = true;
        let maxAllowedFaces = 1;
        let isPeekingActive = false;
        let faceDetection = null;
        let currentCoords = { lat: 'Fetching...', lon: 'Fetching...' };
        let mediaStream = null;

        function updateThreshold(val) {
            maxAllowedFaces = parseInt(val);
            thresholdValDisplay.textContent = maxAllowedFaces;
        }

        function toggleAudio(checkbox) {
            audioEnabled = checkbox.checked;
            addLog(`Audio alerts turned ${audioEnabled ? 'ON' : 'OFF'}`);
        }

        async function toggleCamera(checkbox) {
            cameraEnabled = checkbox.checked;
            if (cameraEnabled) {
                await startCamera();
                addLog("Camera turned ON");
            } else {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
                videoElement.srcObject = null;
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                statusBanner.className = "absolute top-4 z-10 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-slate-700/50 text-slate-400 border border-slate-600/30 transition-all duration-300";
                statusBanner.textContent = "Camera Paused";
                addLog("Camera turned OFF");
            }
        }

        function refreshGPS() {
            gpsReadout.textContent = "📍 GPS: Locating...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentCoords.lat = position.coords.latitude.toFixed(6);
                        currentCoords.lon = position.coords.longitude.toFixed(6);
                        gpsReadout.textContent = `📍 Lat: ${currentCoords.lat}, Lon: ${currentCoords.lon}`;
                    },
                    (error) => {
                        gpsReadout.textContent = "📍 GPS: Unavailable";
                        currentCoords.lat = "N/A";
                        currentCoords.lon = "N/A";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        function playBeep() {
            if (!audioEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 587.33; 
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function addLog(message, isWarning = false) {
            if (logContainer.querySelector('.italic')) {
                logContainer.innerHTML = '';
            }
            const time = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = `p-2 rounded-lg border ${isWarning ? 'bg-red-950/30 border-red-900/50 text-red-300' : 'bg-slate-800/50 border-slate-700/50 text-slate-300'}`;
            logItem.innerHTML = `<span class="opacity-60">[${time}]</span> ${message}`;
            logContainer.prepend(logItem);
        }

        function onResults(results) {
            if (!cameraEnabled) return;

            if (videoElement.videoWidth > 0 && canvasElement.width !== videoElement.videoWidth) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            const faces = results.detections || [];
            const count = faces.length;
            faceCountDisplay.textContent = count;

            if (count > maxAllowedFaces) {
                statusBanner.className = "absolute top-4 z-10 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse transition-all duration-300";
                statusBanner.textContent = `WARNING: ${count} Faces Detected!`;

                if (!isPeekingActive) {
                    isPeekingActive = true;
                    playBeep();
                    addLog(`Peeker detected! (${count} faces found, limit is ${maxAllowedFaces})`, true);
                }

                for (const detection of faces) {
                    drawRectangle(canvasCtx, detection.bounding_box, { color: '#ef4444', lineWidth: 4 });
                }
            } else if (count > 0 && count <= maxAllowedFaces) {
                statusBanner.className = "absolute top-4 z-10 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition-all duration-300";
                statusBanner.textContent = `System Secure (${count}/${maxAllowedFaces} Faces)`;
                isPeekingActive = false;

                for (const detection of faces) {
                    drawRectangle(canvasCtx, detection.bounding_box, { color: '#10b981', lineWidth: 2 });
                }
            } else {
                statusBanner.className = "absolute top-4 z-10 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-amber-500/20 text-amber-400 border border-amber-500/30 transition-all duration-300";
                statusBanner.textContent = "Searching for User...";
                isPeekingActive = false;
            }

            canvasCtx.restore();
        }

        function drawRectangle(ctx, box, style) {
            const x = box.xCenter * ctx.canvas.width - (box.width * ctx.canvas.width) / 2;
            const y = box.yCenter * ctx.canvas.height - (box.height * ctx.canvas.height) / 2;
            const w = box.width * ctx.canvas.width;
            const h = box.height * ctx.canvas.height;

            ctx.strokeStyle = style.color;
            ctx.lineWidth = style.lineWidth;
            ctx.strokeRect(x, y, w, h);
        }

        function captureGeotaggedPhoto() {
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = videoElement.videoWidth || 1280;
            snapCanvas.height = videoElement.videoHeight || 720;
            const ctx = snapCanvas.getContext('2d');

            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, -snapCanvas.width, 0, snapCanvas.width, snapCanvas.height);
            ctx.restore();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(20, snapCanvas.height - 90, 500, 70);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px monospace';
            ctx.fillText(`📍 Lat: ${currentCoords.lat} | Lon: ${currentCoords.lon}`, 35, snapCanvas.height - 55);
            ctx.font = '12px monospace';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText(`🕒 ${new Date().toLocaleString()}`, 35, snapCanvas.height - 30);

            const link = document.createElement('a');
            link.download = `geotagged_snap_${Date.now()}.jpg`;
            link.href = snapCanvas.toDataURL('image/jpeg', 0.9);
            link.click();

            addLog(`Captured geotagged photo`);
        }

        function initDetector() {
            faceDetection = new FaceDetection({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
            });

            faceDetection.setOptions({
                model: 'short',
                minDetectionConfidence: 0.6
            });

            faceDetection.onResults(onResults);

            startCamera();
            refreshGPS();
        }

        async function startCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                videoElement.srcObject = mediaStream;
                
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    predictWebcam();
                };
            } catch (error) {
                console.error("Camera access failed:", error);
                alert("Camera access denied or unavailable.");
            }
        }

        async function predictWebcam() {
            if (!cameraEnabled) return;
            if (videoElement.readyState >= 2) {
                try {
                    await faceDetection.send({ image: videoElement });
                } catch (err) {
                    console.error("Frame processing error:", err);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        window.onload = initDetector;
    </script>
</body>
</html>
